name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lanzarla a mano desde la pestaña Actions, sin tener que empujar nada.
  workflow_dispatch:

# Permisos mínimos para TODO el workflow. Cada trabajo pide solo lo que necesita
# por encima de esto, y por defecto no escribe en el repositorio ni en las PR: si
# un paso de aquí se viera comprometido (una acción de terceros, una dependencia),
# lo máximo que puede hacer con el token es leer.
permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos validando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # LTS vigente. Node 20 salió de soporte en abril de 2026.
  NODE_VERSION: 24

# ── Las acciones van pinadas a un SHA completo, con la versión en el comentario ──
# Un tag como `@v4` lo puede mover quien mantiene la acción (o quien se haga con
# su cuenta) y cambiar lo que corre aquí sin que cambie ningún fichero del repo.
# Un SHA no se puede mover. Dependabot actualiza el SHA y el comentario a la vez
# (ver .github/dependabot.yml), así que pinar no significa quedarse atrás.
#
#   actions/checkout          3d3c42e5aac5ba805825da76410c181273ba90b1   v7.0.1
#   actions/setup-node        949feb2413d6458794dcd2491c4babbbce0c15c1   v7.1.0
#   gitleaks/gitleaks-action  e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   v3.0.0

jobs:
  # ── Rápido y sin Docker: da señal en segundos ───────────────────────────
  esquema:
    name: Esquema (sin Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones y comprobar aislamiento
        run: npm run db:check

      # La paleta se lee del propio tokens.ts, así que esto falla en cuanto
      # alguien mete un color que no llega al contraste mínimo.
      - name: La paleta cumple WCAG AA
        run: npm run check:contrast

  # ── El veredicto de verdad: Supabase real en Docker ─────────────────────
  base-de-datos:
    name: Base de datos (Supabase real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # La CLI viene fijada en package.json: la CI usa exactamente la misma
      # versión que se usa en local.
      - name: Levantar Supabase
        run: npm run db:start

      - name: Aplicar migraciones y seed
        run: npm run db:reset

      - name: Tests pgTAP
        run: npm run db:test

      # Lo que pgTAP no puede probar: pgTAP corre en UNA transacción y una carrera
      # necesita DOS sesiones solapadas. Dos personas actuando a la vez sobre el
      # mismo elemento (terminar y tirar, o gastar más de lo que queda).
      - name: Carreras entre dos personas
        run: npm run db:carreras

      # Q2: los tipos se versionan y aquí se comprueba que siguen al día. Es
      # más rápido que regenerarlos en cada trabajo, y caza el despiste de
      # cambiar el esquema sin regenerarlos.
      - name: Los tipos generados siguen al día
        run: |
          if [ ! -f app/package.json ]; then
            echo "::notice::Todavía no hay app Expo: no hay tipos que comprobar."
            exit 0
          fi
          npm run types
          if [ -n "$(git status --porcelain app/src/lib/database.types.ts)" ]; then
            echo "::error::El esquema cambió y los tipos no. Ejecuta 'npm run types' y haz commit del resultado."
            git diff -- app/src/lib/database.types.ts | head -60
            exit 1
          fi

      - name: Parar Supabase
        if: always()
        run: npm run db:stop

  # ── La app ───────────────────────────────────────────────────────────────
  app:
    name: App (typecheck y lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck y lint
        run: |
          if [ ! -f app/package.json ]; then
            echo "::notice::Todavía no hay app Expo (tarea D1). Nada que comprobar."
            exit 0
          fi
          npm run --workspace app typecheck
          npm run --workspace app lint

  # ── Secretos y dependencias ──────────────────────────────────────────────
  # Las dos puertas son BLOQUEANTES: un aviso nuevo o una clave en el historial
  # impiden el merge. No se confía en que alguien lo mire.
  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks lo usa para saber qué commits trae una PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: una clave subida y borrada en un commit anterior
          # sigue siendo una clave publicada, y solo se ve recorriéndolo.
          fetch-depth: 0
          persist-credentials: false

      - name: Escáner de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Falla ante cualquier aviso alto o crítico SIN exención vigente. Las
      # exenciones están en docs/security-waivers.json, con motivo y fecha límite.
      - name: Avisos de dependencias
        run: npm run check:audit
